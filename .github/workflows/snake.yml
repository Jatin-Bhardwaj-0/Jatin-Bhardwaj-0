name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Jatin-Bhardwaj-0
          outputs: dist/github-contribution-grid-snake.svg
          color_snake: "#00FF7F" # neon green
          color_dots: "#1E90FF"  # electric blue
          color_empty: "#0A0A0A" # dark background

      - name: Push Snake Animation
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
